{% extends 'base.html' %}
{% block contenuto %}
<h1>Partiti</h1>
{% if not partiti_header %}
  <p class="vuoto">Nessun partito inserito.</p>
{% endif %}
<div class="griglia">
  {% for p in partiti_header %}
    <a class="card {{ p.schieramento }}" href="{{ p.get_absolute_url }}">{{ p.nome }}</a>
  {% endfor %}
</div>
<h2 class="titoletto">Confronti</h2>
<div class="griglia">
  <a class="card neutra" href="{% url 'confronto' %}">Confronto per tema</a>
  <a class="card neutra" href="{% url 'metodo' %}">Come giudichiamo</a>
</div>
{% endblock %}
