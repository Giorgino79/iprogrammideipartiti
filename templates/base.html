{% load static %}<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Analisi programmi dei partiti{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'analisi/stile.css' %}">
</head>
<body>
<header class="testata">
  <a class="marchio" href="{% url 'home' %}">Analisi programmi dei partiti</a>
  <nav class="simboli" aria-label="Partiti">
    {% for p in partiti_header %}
      <a class="simbolo {{ p.schieramento }}{% if p.logo %} con-logo{% endif %}{% if partito and partito.pk == p.pk %} attivo{% endif %}" href="{{ p.get_absolute_url }}" title="{{ p.nome }}">
        {% if p.logo %}<img src="{{ p.logo.url }}" alt="{{ p.nome }}">{% else %}<span>{{ p.sigla }}</span>{% endif %}
      </a>
    {% endfor %}
  </nav>
</header>
<main class="pagina">
  {% block contenuto %}{% endblock %}
</main>
{% block script %}{% endblock %}
</body>
</html>
